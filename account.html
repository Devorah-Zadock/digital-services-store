<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>כניסה לחשבון — DeskKit</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .qa-gate-wrap { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
  .qa-gate-box {
    background: var(--white); border: 1px solid #EAEDEC; border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 36px 32px; max-width: 380px; width: 100%;
  }
  .qa-gate-box h1 { font-size: 20px; color: var(--teal-dark); margin: 0 0 6px; text-align: center; }
  .qa-gate-box p.sub { font-size: 13.5px; color: var(--grey); margin: 0 0 20px; text-align: center; }
  .qa-gate-box .field { display: grid; gap: 5px; margin-bottom: 12px; text-align: right; }
  .qa-gate-box label { font-size: 13px; font-weight: 700; color: var(--teal-dark); }
  .qa-gate-box input[type="email"], .qa-gate-box input[type="password"], .qa-gate-box input[type="text"] {
    width: 100%; box-sizing: border-box; padding: 11px 13px; border-radius: 8px; border: 1px solid #DADFDD;
    font-family: inherit; font-size: 14.5px;
  }
  .qa-err { color: #B23; font-size: 13px; min-height: 18px; margin: 4px 0 8px; }
  .qa-msg { color: var(--teal-dark); font-size: 13px; min-height: 18px; margin: 4px 0 8px; }
  .qa-switch { text-align: center; font-size: 13.5px; margin-top: 14px; color: var(--grey); }
  .qa-switch button { background: none; border: none; color: var(--teal); font-weight: 700; cursor: pointer; font-family: inherit; font-size: 13.5px; padding: 0; }
  .qa-forgot { text-align: center; margin-top: 8px; }
  .qa-forgot button { background: none; border: none; color: var(--grey); cursor: pointer; font-family: inherit; font-size: 12.5px; text-decoration: underline; padding: 0; }
  .qa-google-btn {
    width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--white); border: 1px solid #DADFDD; border-radius: 8px; padding: 11px 13px;
    font-family: inherit; font-size: 14.5px; font-weight: 600; color: var(--dark); cursor: pointer;
    transition: background .15s ease, box-shadow .15s ease;
  }
  .qa-google-btn:hover { background: var(--grey-light); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .qa-divider { display: flex; align-items: center; gap: 10px; margin: 16px 0; color: var(--grey); font-size: 12.5px; }
  .qa-divider::before, .qa-divider::after { content: ""; flex: 1; height: 1px; background: #EAEDEC; }
</style>
</head>
<body>

<header class="site no-print">
  <nav class="nav">
    <a href="index.html" class="brand"><svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path class="bm-face" d="M6 3H14L18 7V20H6Z"/><path class="bm-fold" d="M14 3L14 7H18Z"/></svg>DeskKit</a>
    <div class="nav-links">
      <a href="index.html">בית</a>
      <a href="products.html">קטלוג</a>
      <a href="sites.html">בניית אתר</a>
      <a href="tools.html">כלים לעסק</a>
      <a href="about.html">אודות</a>
      <a href="contact.html">צור קשר</a>
    </div>
    <a href="#" id="nav-login-link" class="nav-login nav-login-pending">כניסה</a>
    <a href="products.html" class="nav-cta">לצפייה בקטלוג</a>
    <button class="burger" aria-label="תפריט">☰</button>
  </nav>
</header>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<div id="qa-auth" class="qa-gate-wrap no-print">
  <div class="qa-gate-box">
    <div id="qa-auth-form-wrap">
      <h1 id="qa-auth-title">כניסה</h1>
      <button type="button" id="qa-google-btn" class="qa-google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.6 3 24 3 16.3 3 9.7 7.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.3 36 26.8 37 24 37c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.5 40.6 16.2 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.7l6.3 5.3C41.5 35.9 45 30.4 45 24c0-1.4-.1-2.7-.4-3.5z"/></svg>
        <span>המשך עם Google</span>
      </button>
      <div class="qa-divider"><span>או</span></div>
      <form id="qa-auth-form">
        <div class="field"><label>אימייל</label><input type="email" id="qa-email" dir="ltr" autocomplete="email" required></div>
        <div class="field"><label>סיסמה</label><input type="password" id="qa-password" autocomplete="current-password" required minlength="6"></div>
        <div class="qa-err" id="qa-auth-err"></div>
        <div class="qa-msg" id="qa-auth-msg"></div>
        <button type="submit" class="btn btn-teal" style="width:100%;" id="qa-auth-submit">כניסה</button>
      </form>
      <div class="qa-switch">
        <span id="qa-switch-text">עדיין אין לכם חשבון?</span>
        <button type="button" id="qa-switch-btn">להרשמה</button>
      </div>
      <div class="qa-forgot">
        <button type="button" id="qa-forgot-btn">שכחתי סיסמה</button>
      </div>
    </div>
    <div id="qa-check-email" style="display:none; text-align:center;">
      <div style="font-size:40px; margin-bottom:8px;">📬</div>
      <h1 style="margin-bottom:10px;">נשאר רק שלב אחד</h1>
      <p class="sub" style="margin-bottom:6px;">שלחנו מייל אישור לכתובת:</p>
      <p style="font-weight:700; color:var(--teal-dark); direction:ltr; margin-bottom:18px;" id="qa-check-email-addr"></p>
      <p class="sub" style="margin-bottom:22px;">לוחצים על הקישור במייל (בדקו גם ספאם) — ואז זה יחזיר אתכם לכאן מחוברים אוטומטית.</p>
      <button type="button" class="btn btn-outline" style="width:100%;" id="qa-back-to-login">חזרה למסך התחברות</button>
    </div>
  </div>
</div>

<script src="js/supabase-config.js"></script>
<script src="js/nav-auth.js"></script>
<script src="js/account.js"></script>
</body>
</html>
