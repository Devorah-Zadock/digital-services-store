# Deploys the Supabase side of DeskKit, so nothing has to be copied into
# the dashboard by hand.
#
# On every merge to main that touches supabase/:
#   1. runs the SQL files that changed in that push (SQL first — new
#      function code may depend on it), then
#   2. deploys every Edge Function in supabase/functions.
# Manually (Actions → "Supabase deploy" → Run workflow): the same, or a
# read-only security check of the live project, or an auth-settings change.
#
# One-time setup: a Supabase personal access token saved in GitHub →
# Settings → Secrets and variables → Actions as SUPABASE_ACCESS_TOKEN.
name: Supabase deploy

on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:
    inputs:
      task:
        description: "What to do"
        type: choice
        default: check-live
        options: [check-live, deploy-functions, run-sql, auth-settings, turnstile-enable, turnstile-disable, auth-errors, smtp-resend, auth-templates, admin-lockdown, admin-reset, site-links-email-dry, site-links-email]
      sql_files:
        description: "run-sql: space-separated SQL files"
        default: ""
      auth_patch:
        description: 'auth-settings: JSON, e.g. {"password_min_length": 8}'
        default: ""

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  PROJECT_REF: vafkjsetlrpaczsmqvqs
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run changed SQL files (merge)
        if: github.event_name == 'push'
        run: |
          files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'supabase/sql/*.sql' | grep -v 'security_check_live.sql' || true)
          if [ -z "$files" ]; then echo "No SQL changes."; exit 0; fi
          existing=""
          for f in $files; do [ -f "$f" ] && existing="$existing $f"; done
          [ -z "$existing" ] && { echo "No SQL changes."; exit 0; }
          python3 .github/scripts/supabase_api.py sql $existing

      - name: Run SQL files (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'run-sql'
        run: python3 .github/scripts/supabase_api.py sql ${{ inputs.sql_files }}

      - uses: supabase/setup-cli@v1
        if: github.event_name == 'push' || inputs.task == 'deploy-functions'
        with:
          version: latest

      # verify_jwt off: every function checks the caller's token itself
      # (submit-contact-message is public by design).
      - name: Deploy all Edge Functions
        if: github.event_name == 'push' || inputs.task == 'deploy-functions'
        run: supabase functions deploy --project-ref "$PROJECT_REF" --no-verify-jwt --use-api

      - name: Live security check (read-only)
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'check-live'
        run: |
          python3 .github/scripts/supabase_api.py auth-show
          python3 .github/scripts/supabase_api.py sql supabase/sql/security_check_live.sql

      - name: Recent Auth errors (read-only, redacted)
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'auth-errors'
        run: python3 .github/scripts/supabase_api.py auth-errors 90

      - name: Change auth settings
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'auth-settings'
        env:
          AUTH_PATCH: ${{ inputs.auth_patch }}
        run: python3 .github/scripts/supabase_api.py auth-patch "$AUTH_PATCH"

      # Only after js/captcha.js has the site key and is live — otherwise
      # sign-up/log-in would demand a token the pages can't produce yet.
      - name: Turnstile on/off
        if: github.event_name == 'workflow_dispatch' && (inputs.task == 'turnstile-enable' || inputs.task == 'turnstile-disable')
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: python3 .github/scripts/supabase_api.py ${{ inputs.task }}

      - name: Auth emails from deskkit.co.il / Hebrew templates
        if: github.event_name == 'workflow_dispatch' && (inputs.task == 'smtp-resend' || inputs.task == 'auth-templates')
        env:
          RESEND_SMTP_KEY: ${{ secrets.RESEND_SMTP_KEY }}
        run: python3 .github/scripts/supabase_api.py ${{ inputs.task }}

      - name: Admin area emergency (lockdown / reset)
        if: github.event_name == 'workflow_dispatch' && (inputs.task == 'admin-lockdown' || inputs.task == 'admin-reset')
        run: python3 .github/scripts/supabase_api.py ${{ inputs.task }}

      # One-time: tell every owner of a published site its new address
      # (each owner at most once; the log shows counts only).
      - name: Email site owners their new site address
        if: github.event_name == 'workflow_dispatch' && (inputs.task == 'site-links-email-dry' || inputs.task == 'site-links-email')
        env:
          RESEND_SMTP_KEY: ${{ secrets.RESEND_SMTP_KEY }}
        run: python3 .github/scripts/site_links_email.py ${{ inputs.task == 'site-links-email' && 'send' || 'dry-run' }}
