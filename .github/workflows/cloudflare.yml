# Hosting on Cloudflare (replacing Vercel's Hobby plan, which doesn't
# allow commercial use).
#
#   deskkit-web    the main site's static files (cloudflare/web)
#   deskkit-sites  customer sites on <slug>.deskkit.co.il (cloudflare/sites)
#
# Every push to main redeploys both, so the site on Cloudflare always
# matches the repository. Deploying never changes DNS or routing — only
# the manual "switch" / "rollback" tasks do (see .github/scripts/
# cloudflare_api.py), so it is safe before, during and after the move.
#
# GitHub secrets: CLOUDFLARE_API_TOKEN (Workers + Zone DNS edit),
# CLOUDFLARE_ACCOUNT_ID.

name: Cloudflare

on:
  push:
    branches: [main]
    paths-ignore: ["supabase/**", ".github/workflows/backup.yml", ".github/workflows/supabase-deploy.yml"]
  workflow_dispatch:
    inputs:
      task:
        description: "What to do"
        type: choice
        default: deploy
        options: [deploy, status, smoke, prepare, switch, live, rollback]

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  cloudflare:
    if: github.repository == 'Devorah-Zadock/digital-services-store'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event_name == 'push' || inputs.task == 'deploy'
        with:
          node-version: 22

      - name: Build the main site's files
        if: github.event_name == 'push' || inputs.task == 'deploy'
        run: cloudflare/web/build.sh

      - name: Make sure the account has a workers.dev test address
        if: github.event_name == 'push' || inputs.task == 'deploy'
        run: python3 .github/scripts/cloudflare_api.py subdomain

      - name: Deploy the main site (deskkit-web)
        if: github.event_name == 'push' || inputs.task == 'deploy'
        working-directory: cloudflare/web
        run: npx --yes wrangler@4 deploy

      - name: Deploy customer sites (deskkit-sites)
        if: github.event_name == 'push' || inputs.task == 'deploy'
        working-directory: cloudflare/sites
        run: npx --yes wrangler@4 deploy

      - name: Status / DNS task
        if: always() && (github.event_name == 'push' || inputs.task != '')
        run: python3 .github/scripts/cloudflare_api.py ${{ github.event_name == 'push' && 'status' || (inputs.task == 'deploy' && 'status' || inputs.task) }}
